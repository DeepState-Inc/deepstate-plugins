name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/check.mjs
      - run: node --test tests/*.test.mjs
      - name: registry.json is current
        run: node scripts/build-registry.mjs && git diff --exit-code -- registry.json ':!registry.json' || (git diff -- registry.json | grep -v generatedAt | grep '^[+-]' | grep -v '^[+-][+-]' && exit 1 || true)
